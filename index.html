<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Judgle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
        :root {
            /* Dark Mode (Default) - Matches FIG / Judgle / Qira Palette */
            --bg-primary: #0f1117;
            --bg-card: #1e222d;
            --bg-card-hover: #262b38;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #2d3343;
            --border-hover: #475569;
            --shadow-card: 0 4px 14px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 8px 20px rgba(0, 0, 0, 0.45);

            /* FIG / Brand Accent Colours */
            --fig-green: #22c55e;
            --fig-green-bg: rgba(34, 197, 94, 0.14);
            --fig-blue: #3b82f6;
            --fig-blue-bg: rgba(59, 130, 246, 0.14);
            --fig-orange: #f97316;
            --fig-orange-bg: rgba(249, 115, 22, 0.14);
            --qira-purple: #a855f7;
            --qira-purple-bg: rgba(168, 85, 247, 0.14);
            --fig-teal: #14b8a6;
            --fig-teal-bg: rgba(20, 184, 166, 0.14);
        }

        body.light-mode {
            --bg-primary: #f4f6f9;
            --bg-card: #ffffff;
            --bg-card-hover: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --border-hover: #cbd5e1;
            --shadow-card: 0 2px 10px rgba(15, 23, 42, 0.06);
            --shadow-hover: 0 6px 18px rgba(15, 23, 42, 0.1);

            --fig-green: #16a34a;
            --fig-green-bg: rgba(22, 163, 74, 0.12);
            --fig-blue: #2563eb;
            --fig-blue-bg: rgba(37, 99, 235, 0.12);
            --fig-orange: #ea580c;
            --fig-orange-bg: rgba(234, 88, 12, 0.12);
            --qira-purple: #9333ea;
            --qira-purple-bg: rgba(147, 51, 234, 0.12);
            --fig-teal: #0d9488;
            --fig-teal-bg: rgba(13, 148, 136, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.25s ease, color 0.25s ease;
            -webkit-tap-highlight-color: transparent;
        }

        /* Header Bar */
        header {
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            padding: 1rem 1rem 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--fig-green), var(--fig-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
            box-shadow: 0 3px 10px rgba(59, 130, 246, 0.3);
        }

        .brand-text h1 {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .brand-text span {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
            display: block;
        }

        .icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
        }

        /* Main Container */
        main {
            flex: 1;
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            padding: 0.5rem 1rem 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Condensed Horizontal Project Cards */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.65rem;
        }

        .project-card {
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.85rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-color, var(--fig-blue));
            border-radius: 12px;
            padding: 0.8rem 0.95rem;
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow-card);
            transition: transform 0.18s ease,
                        background-color 0.18s ease,
                        border-color 0.18s ease,
                        box-shadow 0.18s ease;
            animation: cardFadeIn 0.3s ease backwards;
        }

        .project-card:hover {
            transform: translateY(-2px);
            background: var(--bg-card-hover);
            border-color: var(--accent-color, var(--border-hover));
            box-shadow: var(--shadow-hover);
        }

        .project-card:active {
            transform: scale(0.985);
        }

        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--accent-bg, var(--fig-blue-bg));
            color: var(--accent-color, var(--fig-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .card-content {
            flex: 1;
            min-width: 0;
        }

        .card-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.4rem;
            margin-bottom: 0.15rem;
        }

        .card-content h2 {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-badge {
            font-size: 0.62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.15rem 0.45rem;
            border-radius: 999px;
            background: var(--accent-bg, var(--fig-blue-bg));
            color: var(--accent-color, var(--fig-blue));
            flex-shrink: 0;
        }

        .card-content p {
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-chevron {
            color: var(--text-muted);
            font-size: 0.8rem;
            flex-shrink: 0;
            transition: transform 0.18s ease, color 0.18s ease;
        }

        .project-card:hover .card-chevron {
            color: var(--accent-color, var(--text-primary));
            transform: translateX(3px);
        }

        /* Footer */
        footer {
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            padding: 0.65rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile Single-Screen Fit */
        @media (max-width: 640px) {
            header {
                padding: 0.75rem 0.85rem 0.35rem;
            }
            main {
                padding: 0.35rem 0.85rem 0.5rem;
                justify-content: flex-start;
            }
            .project-grid {
                grid-template-columns: 1fr;
                gap: 0.55rem;
            }
            .project-card {
                padding: 0.7rem 0.85rem;
                gap: 0.75rem;
            }
            .card-icon {
                width: 38px;
                height: 38px;
                font-size: 1rem;
            }
            .card-content h2 {
                font-size: 0.95rem;
            }
            .card-content p {
                font-size: 0.76rem;
                -webkit-line-clamp: 1;
            }
            footer {
                padding: 0.5rem 0.85rem;
            }
        }
    </style>
</head>
<body class="dark-mode">

    <header>
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">
                <i class="fas fa-layer-group"></i>
            </div>
            <div class="brand-text">
                <h1>Judgle</h1>
                <span>Trampoline &amp; Gymnastics Judging Projects</span>
            </div>
        </div>
        <button class="icon-btn" id="themeToggle" title="Toggle Light/Dark Mode" aria-label="Toggle Light/Dark Mode">
            <i class="fas fa-sun" id="themeIcon"></i>
        </button>
    </header>

    <main>
        <section class="project-grid" id="projectGrid" aria-label="Judging Projects"></section>
    </main>

    <footer>
        <span>Vibe Coded/Created by <strong>Jed &#127462;&#127482;</strong></span>
    </footer>

    <script>
        /**
         * =====================================================================
         * PROJECT CONFIGURATION
         * Add new projects by appending an object to this array.
         * Set `visible: false` to hide any link without deleting its config.
         *
         * Available colour themes: 'green', 'blue', 'orange', 'purple', 'teal'
         * =====================================================================
         */
        const PROJECTS = [
            {
                id: "rtinput",
                title: "Electronic Judging Interface",
                description: "Real-time execution input",
                url: "rtinput.html",
                icon: "fas fa-tablet-screen-button",
                badge: "Live",
                theme: "green",
                visible: true
            },
            {
                id: "jed",
                title: "Judge Education Designer",
                description: "Execution Overlay and Video Export",
                url: "jed.html",
                icon: "fas fa-graduation-cap",
                badge: "Education",
                theme: "blue",
                visible: true
            },
            {
                id: "qira",
                title: "Qira HD Simulator",
                description: "Qira HD Software Simulator",
                url: "qira.html",
                icon: "fas fa-bullseye",
                badge: "Simulator",
                theme: "purple",
                visible: true
            },
			 {
                id: "landings",
                title: "Landing Deductions Trainer",
                description: "Landing Deductions Trainer",
                url: "landings.html",
                icon: "fas fa-running",
                badge: "Practice",
                theme: "orange",
                visible: true
            },
            {
                id: "judgle",
                title: "Judgle",
                description: "Video execution judging practice across TRP, DMT & TUM",
                url: "judgle.html",
                icon: "fas fa-play-circle",
                badge: "Practice",
                theme: "orange",
                visible: false
            },
            {
                id: "resources",
                title: "Resources",
                description: "CJP/DD rules, reference sheets & deduction video library",
                url: "judgle.html?view=resources",
                icon: "fas fa-book-open",
                badge: "Library",
                theme: "teal",
                visible: true
            }
        ];

        const THEME_MAP = {
            green:  { color: "var(--fig-green)",   bg: "var(--fig-green-bg)" },
            blue:   { color: "var(--fig-blue)",    bg: "var(--fig-blue-bg)" },
            orange: { color: "var(--fig-orange)",  bg: "var(--fig-orange-bg)" },
            purple: { color: "var(--qira-purple)", bg: "var(--qira-purple-bg)" },
            teal:   { color: "var(--fig-teal)",    bg: "var(--fig-teal-bg)" }
        };

        function renderProjects() {
            const grid = document.getElementById("projectGrid");
            grid.innerHTML = "";

            const visibleProjects = PROJECTS.filter(project => project.visible !== false);

            visibleProjects.forEach((project, index) => {
                const palette = THEME_MAP[project.theme] || THEME_MAP.blue;

                const card = document.createElement("a");
                card.className = "project-card";
                card.href = project.url;
                card.style.setProperty("--accent-color", palette.color);
                card.style.setProperty("--accent-bg", palette.bg);
                card.style.animationDelay = `${index * 35}ms`;

                card.innerHTML = `
                    <div class="card-icon">
                        <i class="${project.icon}" aria-hidden="true"></i>
                    </div>
                    <div class="card-content">
                        <div class="card-title-row">
                            <h2>${project.title}</h2>
                            ${project.badge ? `<span class="card-badge">${project.badge}</span>` : ""}
                        </div>
                        <p>${project.description}</p>
                    </div>
                    <i class="fas fa-chevron-right card-chevron" aria-hidden="true"></i>
                `;

                grid.appendChild(card);
            });
        }

        // Theme Management
        const themeToggleBtn = document.getElementById("themeToggle");
        const themeIcon = document.getElementById("themeIcon");

        function applyTheme(mode) {
            if (mode === "light") {
                document.body.classList.remove("dark-mode");
                document.body.classList.add("light-mode");
                themeIcon.className = "fas fa-moon";
            } else {
                document.body.classList.remove("light-mode");
                document.body.classList.add("dark-mode");
                themeIcon.className = "fas fa-sun";
            }
        }

        const savedTheme = localStorage.getItem("judgle_theme") || "dark";
        applyTheme(savedTheme);

        themeToggleBtn.addEventListener("click", () => {
            const isLight = document.body.classList.contains("light-mode");
            const nextTheme = isLight ? "dark" : "light";
            applyTheme(nextTheme);
            localStorage.setItem("judgle_theme", nextTheme);
        });

        renderProjects();
    </script>
</body>
</html>
