<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">
    <title>Judgle</title>
  <meta name="jg-footer" content="Development in progress. All scores are test scores and not relevant to the video shown.">
  <meta name="jg-help" content="judgle">
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/judgle.css">
</head>
<body>
	<div class="top-icons">
		 <h1 class="logo">Judgle</h1>

		<i class="fas fa-home home-icon" title="Home - Reset & Return to Quiz" onclick="goHome()"></i>
		<i class="fas fa-adjust mode-toggle" title="Toggle Light/Dark Mode" onclick="toggleMode()"></i>
		<i class="fas fa-undo reset-icon" title="Reset Quiz" onclick="restartQuiz()"></i>
		<i class="fas fa-history history-icon" title="View History" id="historyButton" onclick="toggleVideoHistory()"></i>
		<i class="fas fa-book resource-icon" title="Resource Library" onclick="toggleResourceLibrary()"></i>
	
	</div>

	<!-- Resource Library Section -->
	<div id="resourceLibrary" class="resource-library hidden">
		<div class="resource-header">
			<h2>Resource Library</h2>
			<i class="fas fa-times resource-close-icon" title="Close Resource Library" onclick="toggleResourceLibrary()"></i>
			<!--<button class="share-link-btn" onclick="copyResourceLink()" title="Copy shareable link to resource library">
				<i class="fas fa-share-alt"></i> Share Resource Link
			</button>-->
			<div class="tag-filter-container">
				<span class="filter-label">Filter by tag:</span>
				<div id="tagFilters" class="tag-filters"></div>
				<button class="clear-filters-btn" onclick="clearTagFilters()">Clear Filters</button>
			</div>
		</div>
		<div id="resourceGrid" class="resource-grid"></div>
	</div>

	<!-- Main Content -->
	<div id="mainContent">
		<div class="container">
			<!-- Video Library -->
			<div class="container">
				<div class="video-list">
					<div id="latestVideoContainer">
						
					</div> <!-- Placeholder for the latest video -->

					<!-- Hidden videos (will be shown when clicking "View History") -->
					<div id="hiddenVideos" style="display: none;">
						<div class="video-item" onclick="loadVideo('vid2')">
							<p>TRA 2</p>
						</div>
						<div class="video-item" onclick="loadVideo('vid3')">
							<p>DMT</p>
						</div>
					</div>
				</div>			
			</div>
		</div>
		<div id="warningMessage" class="hidden">Please fill in all deductions before submitting.</div>
		<!-- Video Embed -->
		<div class="video-container" id="videoPlayer">
			<!-- Will load selected video here -->
		</div>
		
		<div class="container">
			<!-- Number Input Section -->
			<div>
				<h3>Enter Your Deductions:</h3>
				<form id="quizForm">
					<div id="inputContainer">
						<!-- Input fields will be dynamically generated here -->
					</div>
					<br>
					<button type="button" id="submitButton" class="button" onclick="checkAnswers()">Submit</button>
				</form>

				<!-- Result Section -->
				<div class="result" id="result"></div>
			</div>

			<!-- Answer Table -->
			<table class="answer-table" id="answerTable" style="display:none;">
				<thead>
					<tr>
						<th>Element</th>
						<th>Your Deduction</th>
						<th>Correct Deduction</th>
						<th>Explanation</th>
					</tr>
				</thead>
				<tbody id="answerTableBody">
					<!-- Answer details will be added dynamically here -->
				</tbody>
			</table>
		</div>
	</div>
    <script src="js/judgle-storage.js"></script>
<script src="data/help.js"></script>
<script src="js/judgle-help.js"></script>
<script src="data/videos.js"></script>
<script src="data/resources.js"></script>
<script src="js/judgle.js"></script>
</body>
</html>
