<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Judgle rules tests</title>
  <meta name="jg-footer" content="Open this page after editing js/judgle-rules.js. Every line should be green.">
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/theme.css">
  <style>
    body { margin: 0; padding: 16px 16px 0; background: var(--bg-dark); color: var(--text-main); font-family: var(--font-ui); min-height: 100vh; display: flex; flex-direction: column; }
    h1 { font-size: 1.2rem; margin: 0 0 4px 44px; }
    .sum { margin: 0 0 12px 44px; color: var(--text-sub); font-size: .85rem; }
    .row { display: flex; gap: 8px; padding: 5px 10px; margin-bottom: 4px; background: var(--card-bg); border: 1px solid var(--border-col); border-radius: 8px; font-size: .85rem; }
    .ok { border-left: 4px solid var(--fig-green); } .bad { border-left: 4px solid var(--fig-red); }
    .d { color: var(--fig-red); }
  </style>
</head>
<body>
  <h1>Judgle rules tests</h1>
  <div class="sum" id="sum"></div>
  <div id="out"></div>
  <script src="../js/judgle-rules.js"></script>
  <script src="rules-tests.js"></script>
  <script>
    const res = runRulesTests(JudgleRules);
    const bad = res.filter(r => !r.ok).length;
    document.getElementById('sum').textContent = (res.length - bad) + ' of ' + res.length + ' passed. CoP status: ' + JudgleRules.COP.status + ' (' + JudgleRules.COP.edition + ')';
    document.getElementById('out').innerHTML = res.map(r =>
      '<div class="row ' + (r.ok ? 'ok' : 'bad') + '"><span>' + (r.ok ? '\u2713' : '\u2717') + '</span><span>' + r.name + '</span><span class="d">' + r.detail + '</span></div>').join('');
  </script>
</body>
</html>
